version: '3.8'

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: etms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_DATABASE:-surat_embroidery_erp}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-surat_embroidery_erp}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - etms-network

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: etms-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - etms-network

  pdf-service:
    build:
      context: ./pdf-service
      dockerfile: Dockerfile
    container_name: etms-pdf-service
    restart: unless-stopped
    ports:
      - "${PDF_SERVICE_PORT:-3001}:3001"
    environment:
      PORT: "3001"
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - etms-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: etms-backend
    restart: unless-stopped
    ports:
      - "${PORT:-4000}:4000"
    environment:
      NODE_ENV: development
      PORT: "4000"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_DATABASE: ${DB_DATABASE:-surat_embroidery_erp}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_SECRET: ${JWT_SECRET:-surat_embroidery_super_secret_jwt_key_2026}
      JWT_EXPIRATION: 86400s
      PDF_SERVICE_URL: http://pdf-service:3001
      LOG_LEVEL: debug
      OPENWA_API_URL: http://openwa-gateway:2785
      OPENWA_API_KEY: owa_k1_8b891fbe26151557e088c36d0952bb42eea8429d41f62e9c4d7ad9317af7e5f5
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
      - ./backend/logs:/usr/src/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pdf-service:
        condition: service_healthy
    networks:
      - etms-network

  openwa:
    image: docker.io/rmyndharis/openwa:latest
    container_name: openwa-gateway
    restart: unless-stopped
    environment:
      - CSP_UPGRADE_INSECURE_REQUESTS=false
    ports:
      - "${OPENWA_PORT:-2785}:2785"
    volumes:
      - openwa_data:/app/data
    networks:
      - etms-network

networks:
  etms-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  openwa_data:
    driver: local
